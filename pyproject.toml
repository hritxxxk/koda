[project]
name = "koda"
version = "0.1.0"
description = "Modern terminal training for DSA, SQL, and code refinement."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual",
    "click",
    "anthropic",
    "openai",
    "google-genai",
    "httpx",
    "python-dotenv",
    "tomli-w",
]

[project.scripts]
koda = "ai_dsa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
